name: Release

# Publishes a GitHub release with the signed APK when a version tag is pushed:
#   git tag v0.4.0 && git push origin v0.4.0
# The signing key comes from the repository secrets NR_KEYSTORE_BASE64, NR_KEYSTORE_PASSWORD,
# NR_KEY_ALIAS and NR_KEY_PASSWORD.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.4.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Check the signing secrets
        env:
          NR_KEYSTORE_BASE64: ${{ secrets.NR_KEYSTORE_BASE64 }}
          NR_KEYSTORE_PASSWORD: ${{ secrets.NR_KEYSTORE_PASSWORD }}
          NR_KEY_ALIAS: ${{ secrets.NR_KEY_ALIAS }}
          NR_KEY_PASSWORD: ${{ secrets.NR_KEY_PASSWORD }}
        run: |
          missing=""
          for s in NR_KEYSTORE_BASE64 NR_KEYSTORE_PASSWORD NR_KEY_ALIAS NR_KEY_PASSWORD; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build the signed release APK
        env:
          NR_KEYSTORE_BASE64: ${{ secrets.NR_KEYSTORE_BASE64 }}
          NR_KEYSTORE_PASSWORD: ${{ secrets.NR_KEYSTORE_PASSWORD }}
          NR_KEY_ALIAS: ${{ secrets.NR_KEY_ALIAS }}
          NR_KEY_PASSWORD: ${{ secrets.NR_KEY_PASSWORD }}
        run: |
          export NR_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$NR_KEYSTORE_BASE64" | base64 --decode > "$NR_KEYSTORE_FILE"
          ./gradlew :app:assembleRelease -PversionName="${TAG#v}" --stacktrace
          rm -f "$NR_KEYSTORE_FILE"

      - name: Verify the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare the files
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NineReader-${TAG}.apk"
          (cd dist && sha256sum "NineReader-${TAG}.apk" > "NineReader-${TAG}.apk.sha256")

      - name: Release notes
        run: |
          previous=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          range="${previous:+$previous..}${TAG}"
          {
            echo "## NineReader ${TAG#v}"
            echo
            echo "Lecteur et éditeur de PDF hors ligne pour Android 8.0 et plus."
            echo
            echo "### Nouveautés"
            git log --no-merges --pretty='- %s' "$range" | grep -E '^- (feat|fix|perf)' || echo "- Corrections et améliorations"
            echo
            echo "### Installation"
            echo "Téléchargez \`NineReader-${TAG}.apk\` ci-dessous et ouvrez-le sur le téléphone (autoriser l'installation depuis cette source)."
            echo "Empreinte SHA-256 dans \`NineReader-${TAG}.apk.sha256\`."
            if [ -n "$previous" ]; then
              echo
              echo "**Toutes les modifications** : https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${TAG}"
            fi
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: NineReader ${{ env.TAG }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            dist/NineReader-${{ env.TAG }}.apk
            dist/NineReader-${{ env.TAG }}.apk.sha256
